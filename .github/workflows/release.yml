name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('Config/Release.json'))
          assert os.environ['RELEASE_TAG'] == 'v' + config['version'], 'Tag must match Config/Release.json'
          assert os.environ['RELEASE_REPOSITORY'] == config['repository'], 'Configure the repository for this fork before releasing'
          PY
      - name: Build dependencies and run checks
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/check-project.py
          brew install pkgconf cmake
          python3 scripts/fetch-vendor.py
          python3 scripts/build-media.py
          python3 scripts/build-runtime.py
          swift package dump-package > .build/package-manifest.json
          python3 scripts/check-project.py
          python3 scripts/test.py
      - name: Import optional Apple signing credentials
        env:
          APPLE_CERTIFICATES_BASE64: ${{ secrets.APPLE_CERTIFICATES_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 scripts/ci-signing.py
      - name: Build, sign and prepare update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          key = os.environ.get('SPARKLE_PRIVATE_KEY', '').strip()
          if not key: raise SystemExit('Configure the SPARKLE_PRIVATE_KEY repository secret')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sparkle-key'
          path.write_text(key)
          path.chmod(0o600)
          env = dict(os.environ, SPARKLE_KEY_FILE=str(path))
          try:
              subprocess.run(['python3', 'scripts/build.py'], env=env, check=True)
              subprocess.run(['python3', 'scripts/verify-package.py'], env=env, check=True)
              subprocess.run(['python3', 'scripts/prepare-release.py'], env=env, check=True)
              subprocess.run(['python3', 'scripts/verify-release.py'], env=env, check=True)
          finally:
              path.unlink(missing_ok=True)
          PY
      - name: Publish all artifacts atomically as a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          files = sorted(glob.glob('dist/*.pkg') + glob.glob('dist/*.zip') + glob.glob('dist/*-third-party-sources.tar.xz'))
          files += ['dist/appcast.xml', 'dist/SHA256SUMS.txt']
          subprocess.run(['gh', 'release', 'create', os.environ['RELEASE_TAG'], '--draft', '--title', 'Resonance ' + os.environ['RELEASE_TAG'], '--notes-file', 'docs/RELEASE_NOTES.md', *files], check=True)
          subprocess.run(['gh', 'release', 'edit', os.environ['RELEASE_TAG'], '--draft=false', '--latest'], check=True)
          PY
      - name: Remove temporary Apple keychain
        if: always()
        run: python3 scripts/ci-signing.py --cleanup
