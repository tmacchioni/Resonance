name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/check-project.py
          brew install pkgconf cmake
          python3 scripts/fetch-vendor.py
          python3 scripts/build-media.py
          python3 scripts/build-runtime.py
      - name: Test
        run: |
          swift package dump-package > .build/package-manifest.json
          python3 scripts/check-project.py
          python3 scripts/test.py
      - name: Build universal app and installer
        run: |
          python3 scripts/build.py
          python3 scripts/verify-package.py
          python3 scripts/test-installation.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Resonance-development
          path: |
            dist/*.pkg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
